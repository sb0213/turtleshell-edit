<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TurtleShell</title>
  <link rel="stylesheet" href="/src/sidepanel.css" />
</head>
<body>
  <main class="app">
    <section class="status-card">
      <div class="camera-select-row">
        <span class="dot" id="statusDot" aria-label="카메라 상태"></span>
        <select id="cameraSelect" aria-label="사용할 카메라"></select>
      </div>
      <div class="camera-preview-frame">
        <img id="cameraPreview" alt="카메라 미리보기" />
        <label class="preview-mode-switch" title="프라이버시 모드">
          <input id="previewModeToggle" type="checkbox" role="switch" aria-label="프라이버시 모드" />
          <span class="preview-switch-track"><span class="preview-switch-thumb"></span></span>
        </label>
      </div>
      <p id="statusDetail">시작을 누르면 자세 분석을 시작합니다.</p>
      <div class="track posture-score-track" role="progressbar" aria-label="자세 이탈 정도" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0"><div id="scoreBar"></div></div>
      <section class="controls">
        <button id="startBtn" class="primary" aria-label="자세 감지 시작" title="자세 감지 시작">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor" /></svg>
        </button>
        <button id="calibrateBtn" class="secondary" aria-label="현재 자세를 기준으로 설정" title="현재 자세를 기준으로 설정" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.9-4L3 10m0-6v6h6M4 13a8 8 0 0 0 14.9 4L21 14m0 6v-6h-6" /></svg>
        </button>
        <button id="stopBtn" class="secondary" aria-label="일시 정지" title="일시 정지" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1" fill="currentColor" stroke="none" /></svg>
        </button>
      </section>
    </section>

    <section class="settings" style="margin-bottom: 12px;">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="posture-message-input">
          <strong>경고 문구 설정</strong>
        </label>
        <div style="display: flex; gap: 8px;">
          <input type="text" id="posture-message-input" value="허리를 펴세요" placeholder="예: 거북목 탈출!" style="flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px;" />
          <button id="save-message-btn" class="secondary" style="padding: 8px 14px; white-space: nowrap;">저장</button>
        </div>
      </div>
    </section>

    <section class="settings">
      <label class="switch-row">
        <span><strong>회의 사이트 자동 중지</strong><small>Meet, Zoom, Teams 등에서 감지 중지</small></span>
        <input id="meetingToggle" type="checkbox" checked />
      </label>
    </section>

    <!-- 기존 settings 또는 적절한 위치에 추가 -->
    <section class="settings" style="margin-bottom: 12px;">
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <strong>일어서기 타이머 (분)</strong>
        <div class="timer-display" aria-live="off" aria-label="일어서기 타이머 남은 시간">
          <strong id="timerCountdown">50:00</strong>
          <small id="timerPhase">집중 중</small>
        </div>
        <div style="display: flex; gap: 8px; align-items: center;">
          <label style="flex: 1; font-size: 12px;">앉기: <input type="number" id="workTimeInput" value="50" min="1" step="1" required style="width: 50px; padding: 4px;" /></label>
          <label style="flex: 1; font-size: 12px;">휴식: <input type="number" id="breakTimeInput" value="10" min="1" step="1" required style="width: 50px; padding: 4px;" /></label>
          <div class="timer-controls" aria-label="일어서기 타이머 제어">
            <button id="timerPlayPauseBtn" class="timer-icon-btn" aria-label="타이머 시작" title="타이머 시작">
              <svg class="timer-play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor" /></svg>
              <svg class="timer-pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM15 5h4v14h-4z" fill="currentColor" /></svg>
            </button>
            <button id="timerStopBtn" class="timer-icon-btn timer-stop-btn" aria-label="타이머 정지" title="타이머 정지" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1" fill="currentColor" /></svg>
            </button>
          </div>
        </div>
      </div>

      <div class="setting-group" style="margin-top: 15px;">
        <label for="tiltIntensityRange">휴식 틸트 강도: <span id="tiltValue">5</span>°</label>
        <input type="range" id="tiltIntensityRange" min="1" max="4" value="4" step="1" style="width: 100%;">
      </div>
    </section>

    <section class="notice" id="notice">
      <strong>개인정보 안내</strong>
      <p>영상은 기기 안에서만 처리하며 저장하거나 전송하지 않습니다.</p>
    </section>

    <footer class="app-footer">TurtleShell <span>v5.4</span></footer>

  </main>
  <script type="module" src="/src/sidepanel.js"></script>
</body>
</html>
